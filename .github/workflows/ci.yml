name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: xdm
          MYSQL_USER: xdm
          MYSQL_PASSWORD: xdm
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/xdm?allowPublicKeyRetrieval=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
