services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: xdm
      MYSQL_USER: xdm
      MYSQL_PASSWORD: xdm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  db-data:
